[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mondayos"
version = "1.0.0b1"
description = "AI Operating System — multi-model coordination platform"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
monday = "monday.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["advisor*", "agents*", "brain*", "core*", "doctor*", "events*", "integrations*", "knowledge*", "memory*", "migrate*", "monday*", "orchestrator*", "search*", "tasks*", "workflows*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["advisor", "agents", "brain", "core", "doctor", "events", "integrations", "knowledge", "memory", "migrate", "monday", "orchestrator", "search", "tasks", "workflows"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: Quality / Python 3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development tools
        run: python -m pip install --editable ".[dev]"

      - name: Check dependency integrity
        run: python -m pip check

      - name: Lint autonomous delivery path
        if: ${{ !cancelled() }}
        run: python -m ruff check core/redaction.py delivery monday/cli.py telegram_bot

      - name: Type-check autonomous delivery path
        if: ${{ !cancelled() }}
        run: python -m mypy core/redaction.py delivery telegram_bot

      - name: Type-check changed CLI surface
        if: ${{ !cancelled() }}
        run: python -m mypy --follow-imports=skip monday/cli.py

      - name: Compile all source modules
        if: ${{ !cancelled() }}
        run: python -m compileall -q -x '(^|/)(build|projects)/' .

  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development tools
        run: python -m pip install --editable ".[dev]"

      - name: Run test suite
        run: python -m pytest
